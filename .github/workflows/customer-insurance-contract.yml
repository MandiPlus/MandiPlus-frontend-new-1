name: Customer insurance contract

on:
  pull_request:
    paths:
      - "src/features/customer-app/**"
      - "scripts/test-customer-insurance-contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/customer-insurance-contract.yml"
  push:
    branches:
      - main
    paths:
      - "src/features/customer-app/**"
      - "scripts/test-customer-insurance-contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/customer-insurance-contract.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:customer-insurance-contract
      - run: npm run build
